schema_version: runtime-config.v1
document_type: runtime-config
mode: development
paths:
  state: /var/tmp/toss-runtime/state
  logs: /var/tmp/toss-runtime/logs
  socket: /var/tmp/toss-runtime/runtime.sock
shutdown_timeout_ms: 30000
logs:
  level: info
  retention_days: 7
  max_bytes: 104857600
gateway_profile: gateway-development
gateway_profiles:
  gateway-development:
    protocol: toss-agentgateway.v1
    endpoint: http://127.0.0.1:8080
    credential_reference: gateway-development-token
    body_observability: off
provider_profiles: []
mcp_profiles: []
skill_roots: []
secret_references:
  gateway-development-token:
    source: env
    key: TOSS_AGENTGATEWAY_TOKEN
