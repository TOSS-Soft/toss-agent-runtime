# Baseline guard: wave six may replace the blocking 1.0.0 check only after
# protected live OpenAI, Anthropic, Gemini, and agentgateway jobs exist.
name: Release validation (publishing disabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version requested for release validation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-only:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Keep v1 publication disabled during the baseline wave
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REQUESTED_VERSION" = "1.0.0" ]; then
            echo "1.0.0 remains blocked until every protected live release gate exists and passes."
            exit 1
          fi
          echo "Validation only: this workflow never authenticates, tags, publishes, or creates a release."
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use latest Node.js LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Confirm Latest LTS runtime
        run: node -e 'if (!process.release.lts) throw new Error(`Expected an LTS runtime, received ${process.version}`); console.log(`${process.version} (${process.release.lts})`)'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and package
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
