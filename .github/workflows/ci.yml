name: CI

on:
  push:
    branches: [main, release/v1.0.0]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Latest Node.js LTS / macos-latest
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use latest Node.js LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Confirm Latest LTS runtime
        run: node -e 'if (!process.release.lts) throw new Error(`Expected an LTS runtime, received ${process.version}`); console.log(`${process.version} (${process.release.lts})`)'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and package
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
